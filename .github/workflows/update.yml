name: Update NHL dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'update.py'
      - 'europe_data.py'
      - 'europe_details.py'
      - 'europe_news.py'
      - 'nhl_today.py'
      - 'nhl_details.py'
      - 'scoring.py'
      - 'tests/**'
      - '.github/workflows/update.yml'
      - 'requirements*.txt'
      - 'README.md'
  schedule:
    - cron: '17 5,6,11,17,21 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'groq>=0.30,<2' 'beautifulsoup4>=4.12,<5'
      - run: python -m pip install 'sportsdataverse==0.2.0b1'
        continue-on-error: true
      - run: node --check site/app.js
      - run: node --check site/install.js
      - run: npm install --no-save --package-lock=false jsdom@26
      - run: node --test tests/test_install.cjs
      - run: python -m py_compile update.py
      - run: python -m unittest discover -s tests
      - uses: actions/cache@v4
        with:
          path: .detail-cache
          key: europe-details-v2-${{ github.run_id }}
          restore-keys: europe-details-v2-
      - run: python update.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId});
              if (response.data.artifacts.filter(a => a.name === name && !a.expired).length === 1) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed("Pages artifact metadata did not become available.");
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
