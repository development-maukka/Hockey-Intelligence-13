<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Hockey Intelligence 13</title><link rel="icon" href="favicon.ico?v=0.5.0" sizes="16x16 32x32 48x48"><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=0.5.0"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=0.5.0"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=0.5.0"><link rel="manifest" href="manifest.json"><style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--muted:#666;--line:#dedede;--panel:#f5f5f5;--active:#171717;--activeText:#fff;--link:#145a9c}
:root[data-theme=dark]{color-scheme:dark;--bg:#111;--fg:#eee;--muted:#aaa;--line:#383838;--panel:#1c1c1c;--active:#eee;--activeText:#111;--link:#9ac9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 11px}button:focus-visible,a:focus-visible{outline:2px solid #5b9be3;outline-offset:2px}header{position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}.wrap{max-width:960px;margin:auto;padding:0 16px}.top{display:flex;align-items:center;gap:10px;padding:12px 0}.top img{width:40px;height:40px;border-radius:7px}.brand{flex:1;min-width:0}h1{font-size:clamp(16px,3.5vw,23px);line-height:1.2;margin:0}#stamp{font-size:11px;color:var(--muted);display:block;margin-top:3px}.tool{padding:0;flex:0 0 38px;height:38px;display:grid;place-items:center;font-size:20px}nav{display:flex;gap:5px;overflow-x:auto;padding:0 0 10px;scrollbar-width:thin}nav button{white-space:nowrap;font-size:13px;flex-shrink:0;padding:7px 10px;border-color:transparent}nav button[aria-current=true]{background:var(--active);color:var(--activeText)}main{padding:18px 0 30px}h2{font-size:23px;line-height:1.2;margin:0 0 14px}h3{font-size:16px;margin:0 0 5px}p{margin:0 0 10px}small,.muted{color:var(--muted);font-size:13px}.brief-item{padding:12px 0;border-bottom:1px solid var(--line)}.brief-item:first-child{padding-top:0}.brief-item p{margin:0;line-height:1.55}.brief-item:last-child{border-bottom:0}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}.modules button{background:var(--panel);text-align:left;min-height:46px;display:flex;justify-content:space-between;align-items:center;gap:6px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-weight:600}a{color:var(--link)}details{margin-top:18px;padding:12px 0;border-top:1px solid var(--line)}summary{cursor:pointer}footer{border-top:1px solid var(--line);padding:12px 0;color:var(--muted);font-size:12px}footer button{font-size:12px;padding:4px 8px}@media(min-width:700px){.modules{grid-template-columns:repeat(4,minmax(0,1fr))}table{font-size:15px}th,td{padding:10px}}
.team-mark{object-fit:contain;vertical-align:middle;margin-right:6px;background:#fff;border-radius:4px;padding:1px}
#leagues{gap:6px;padding-bottom:6px}#leagues button{flex:1;text-align:center;border:1px solid var(--line);font-weight:600}#leagues button[aria-current=true]{border-color:var(--active)}
#leagues[hidden]{display:none}dialog{color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(92vw,380px);padding:20px;max-height:85dvh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.48)}dialog fieldset{border:1px solid var(--line);border-radius:7px;margin:12px 0;padding:8px 12px}dialog label{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}dialog input{width:19px;height:19px;accent-color:var(--fg)}dialog p{margin:8px 0 0}#settings-close{width:100%}
dialog select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin:5px 0}
.game-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px;margin:12px 0}.game-card h3{font-size:18px}.game-card table{margin-bottom:8px}.game-card p:last-child{margin-bottom:0}.game-score{font-size:23px;font-weight:700}
.nl-games,.nl-players{table-layout:fixed;width:100%}
.nl-games th,.nl-games td,.nl-players th,.nl-players td{white-space:normal;overflow-wrap:anywhere;vertical-align:top;line-height:1.3}
.nl-games th:nth-child(1){width:22%}.nl-games th:nth-child(2),.nl-games th:nth-child(4){width:31%}.nl-games th:nth-child(3){width:16%}
.nl-games td:nth-child(3){white-space:nowrap;text-align:center;font-weight:600}.nl-games th:nth-child(3){text-align:center}
.nl-games small,.nl-players small{display:block;font-size:.85em;line-height:1.3;margin-top:3px;overflow-wrap:anywhere}
.nl-players th:first-child{width:52%}.nl-players th:not(:first-child){width:12%}
.nl-players td:not(:first-child),.nl-players th:not(:first-child){text-align:right;white-space:nowrap}
@media(max-width:600px){.nl-games,.nl-players{font-size:12px}.nl-games th,.nl-games td,.nl-players th,.nl-players td{padding:8px 3px}}

.text-link{border:0;background:none;padding:4px 0;color:var(--link);text-decoration:underline;text-underline-offset:3px;min-height:32px;font:inherit;white-space:nowrap}
.team-label{display:inline-flex;align-items:center;gap:5px}.team-label img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:4px;flex-shrink:0}
#detail-dialog{width:min(94vw,760px);max-height:88dvh}#detail-close{display:block;margin:0 0 16px auto}#detail-content h3{margin-top:18px}.detail-note{line-height:1.4}
#detail-content table{table-layout:fixed;font-size:12px}#detail-content th,#detail-content td{white-space:normal;overflow-wrap:anywhere;padding:8px 3px}#detail-content th:first-child{width:43%}
#detail-content .roster-table th:first-child{width:12%}#detail-content .roster-table th:nth-child(2){width:48%}
#detail-content .last-ten th:first-child{width:25%}#detail-content .last-ten th:nth-child(2){width:36%}

.nl-games .team-label{display:flex;flex-direction:column;align-items:center;gap:3px;white-space:normal;text-align:center}.nl-games .team-label span{overflow-wrap:anywhere}.nl-games .team-label img{width:24px;height:24px}.nl-games .text-link{white-space:normal}
.scoring-summary{list-style:none;padding:0;margin:10px 0 18px}.scoring-summary li{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.goal-heading{display:flex;gap:12px;align-items:center;margin-bottom:4px;font-variant-numeric:tabular-nums}.goal-heading strong{margin-left:auto}.scoring-summary p{margin:3px 0 0}
.install-panel{margin:14px 0 0;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;gap:12px;align-items:center}.install-panel p{margin:0;flex:1;min-width:0}.install-actions{display:flex;gap:8px;flex-shrink:0}.install-actions button{min-height:40px}#install-banner[hidden],[data-install-settings][hidden]{display:none}#install-dialog p{margin:12px 0;line-height:1.5}#install-dialog button{width:100%}@media(max-width:480px){.install-panel{align-items:stretch;flex-direction:column}.install-actions button:first-child{flex:1}}
</style></head><body><header><div class="wrap"><div class="top"><img src="icon.svg" alt=""><div class="brand"><h1>Hockey Intelligence 13</h1><small id="stamp"></small></div><button class="tool" id="settings" type="button" aria-haspopup="dialog">⚙</button><button class="tool" id="refresh" type="button">↻</button></div><nav id="leagues" aria-label="League"></nav><nav id="nav" aria-label="Navigation"></nav></div></header><div class="wrap"><main id="main" aria-live="polite"></main><footer>Development Maukka · v0.5.3 <button id="info" type="button">Info</button></footer></div><dialog id="settings-dialog" aria-labelledby="settings-title"><h2 id="settings-title"></h2><div id="settings-body"></div><button id="settings-close" type="button"></button></dialog><dialog id="detail-dialog" aria-labelledby="detail-title"><h2 id="detail-title"></h2><button id="detail-close" type="button"></button><div id="detail-content"></div></dialog><script src="install.js?v=0.5.3"></script><script src="app.js?v=0.5.2"></script></body></html>
